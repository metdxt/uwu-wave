[package]
name = "uwu-wave"
version = "0.1.0"
edition = "2024"
description = "A code-only DAW: music pieces are Rust programs."
license = "MIT"

[dependencies]
hound = "3.5"
cpal = { version = "0.16", optional = true }
rtrb = { version = "0.3", optional = true }
notify = { version = "8", optional = true }

[features]
default = ["play", "live"]
play = ["dep:cpal", "dep:rtrb"]
live = ["dep:notify"]
